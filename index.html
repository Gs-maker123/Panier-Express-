  <meta property="og:image" content="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAoAAAAKACAMAAABoVcEWAAAB0lEQVR4nO3ZsY6DMAwG4DiG7v/+N++EKlSaGmJqDMThn6K2hUpCZQoE8H8+/u8PAAAAAADAbwR/S09g27bPx/cFcB2wANgA3F4AFwALgA3A7QVwAbAA2ADcXgAXAAuADcDtBXABsADYANxeABcAC4ANwO0FcAGwANgA3F4AFwALgA3A7QVwAbAA2ADcXgAXAAuADcDtBXABsADYANxeABcAC4ANwO0FcAGwANgA3F4AFwALgA3A7QVwAbAA2ADcXgAXAAuADcDtBXABsADYANxeABcAC4ANwO0FcAGwANgA3F4AFwALgA3A7QVwAbAA2ADcXgAXAAuADcDtBXABsADYANxeABcAC4ANwO0FcAGwANgA3F4AFwALgA3A7QVwAbAA2ADcXgAXAAuADcDtBXABsADYANxeABcAC4ANwO0FcAGwANgA3F4AFwALgA3A7QVwAbAA2ADcXgAXAAuADcDtBXABsADYANxeABcAC4ANwO0FcAGwANgA3F4AFwALgA3A7QVwAbAA2ADcXgAXAAuADcDtBXABsADYANxeABcAC4ANwO0FcAGwANgA3F4AFwALgA3A7QVwAbAA2ADcXgAXAAuADcDtBXAb29w/+HoBvP4DQP7+BwAAAAAAP+AnAAAA///fNke8quGdPgAAAABJRU5ErkJggg==">
  
  <title>🛒 Panier Express</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="header-row">
        <h1>🛒 Panier Express</h1>
        <button id="themeToggle" class="theme-btn" title="Mode nuit">🌙</button>
      </div>
      <p class="subtitle">Gérez votre inventaire et vos courses en un clin d'œil</p>
    </header>

    <!-- === LISTE DE COURSES === -->
    <section class="shopping-section">
      <div class="shopping-header">
        <h2>🛍️ Liste de courses <span id="shoppingCount" class="badge-count">0</span></h2>
        <button id="toggleShoppingBtn" class="btn-ghost">▼ Afficher</button>
      </div>
      
      <div class="budget-control">
        <div class="budget-row">
          <label for="budgetInput">💰 Budget max :</label>
          <input type="number" id="budgetInput" step="0.01" placeholder="ex: 50" value="50">
          <span>€</span>
        </div>
        <div class="budget-progress">
          <div id="budgetBar" class="budget-bar" style="width:0%"></div>
        </div>
        <div id="budgetAlert" class="budget-alert hidden">⚠️ Vous avez dépassé 80% de votre budget !</div>
      </div>

      <!-- STICKYBAR LISTE DE COURSES avec les boutons d'inventaire -->
      <div class="action-toolbar shopping-toolbar">
        <button id="shoppingCreate" class="toolbar-btn" title="Créer un article">➕</button>
        <button id="shoppingModify" class="toolbar-btn" title="Modifier l'article sélectionné">✏️</button>
        <button id="shoppingDuplicate" class="toolbar-btn" title="Dupliquer l'article sélectionné">📋</button>
        <button id="shoppingReorder" class="toolbar-btn" title="Réorganiser (glisser-déposer)">🔀</button>
        <button id="shoppingSave" class="toolbar-btn" title="Sauvegarder manuellement">💾</button>
        <div class="toolbar-divider"></div>
        <button id="shoppingValidate" class="toolbar-btn success" title="Valider les achats">✅</button>
        <button id="shoppingShare" class="toolbar-btn" title="Partager la liste">📤</button>
        <button id="shoppingCopy" class="toolbar-btn" title="Copier la liste">📋</button>
        <button id="shoppingPrint" class="toolbar-btn" title="Imprimer / PDF">🖨️</button>
        <button id="shoppingClear" class="toolbar-btn danger" title="Vider la liste">🗑️</button>
      </div>

      <div id="shoppingListContainer" class="shopping-list-container hidden">
        <div id="shoppingListContent" class="shopping-list"></div>
      </div>
    </section>

    <!-- === AJOUT RAPIDE === -->
    <div class="add-article-panel">
      <input type="text" id="newArticleName" placeholder="Nom de l'article" autocomplete="off">
      <input type="number" id="newArticleQty" step="0.1" placeholder="Qté" value="1" min="0">
      <select id="newArticleUnit">
        <option value="pcs">pièce(s)</option>
        <option value="kg">kg</option>
        <option value="L">L</option>
        <option value="pack">paquet(s)</option>
        <option value="roll">rouleau(x)</option>
        <option value="other">autre</option>
      </select>
      <select id="newArticleCategory"></select>
      <input type="number" id="newArticlePrice" step="0.01" placeholder="Prix unitaire" value="0.00" min="0">
      <span class="total-preview" id="newArticleTotal">Total : 0.00 €</span>
      <button id="addArticleBtn" class="btn-primary">+ Ajouter</button>
    </div>

    <!-- === FILTRE === -->
    <div class="filter-section">
      <label for="categoryFilter">🔍 Filtrer :</label>
      <select id="categoryFilter">
        <option value="all">Toutes les catégories</option>
      </select>
      <button id="addCategoryBtn" class="btn-small">+ Nouvelle catégorie</button>
    </div>

    <!-- === ACTIONS GLOBALES === -->
    <div class="actions-bar">
      <button id="exportBtn" class="btn-secondary">📁 Exporter</button>
      <button id="importBtn" class="btn-secondary">📂 Importer</button>
      <input type="file" id="importFile" accept=".json" style="display: none;">
      <button id="resetDemoBtn" class="btn-outline">🔄 Exemple par défaut</button>
    </div>

    <!-- === INVENTAIRE === -->
    <section class="inventory-section">
      <h2>📦 Mon inventaire <span id="inventoryCount" class="badge-count">0</span></h2>

      <!-- STICKYBAR INVENTAIRE -->
      <div class="action-toolbar inventory-toolbar">
        <button id="toolbarCreate" class="toolbar-btn" title="Créer un article">➕</button>
        <button id="toolbarModify" class="toolbar-btn" title="Modifier l'article sélectionné">✏️</button>
        <button id="toolbarDuplicate" class="toolbar-btn" title="Dupliquer l'article sélectionné">📋</button>
        <button id="toolbarReorder" class="toolbar-btn" title="Réorganiser (glisser-déposer)">🔀</button>
        <button id="toolbarSave" class="toolbar-btn" title="Sauvegarder manuellement">💾</button>
      </div>

      <div id="articlesGrid" class="inventory-list"></div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Panier Express by GSTK • © GSTK – <span id="currentYear"></span> • Tous droits réservés</p>
    </footer>
  </div>

  <button id="scrollToTopBtn" class="scroll-to-top" title="Retour en haut">↑</button>

  <script src="app.js"></script>
  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();
    
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('✅ Service Worker enregistré', reg))
        .catch(err => console.error('❌ Erreur Service Worker', err));
    }
  </script>
</body>
</html>
